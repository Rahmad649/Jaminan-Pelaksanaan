<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>e-Jampel Pengadaan Jasa</title>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #f3f4f6;
    }
    .app-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden;
    }
    .app-container iframe {
      border: none; width: 100%; height: calc(100% + 40px); margin-top: -40px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Ganti link di bawah ini dengan link Web App Apps Script Anda -->

  </div>
